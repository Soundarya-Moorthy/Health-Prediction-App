{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4>Add Patient</h4>

</div>

<div class="card-body">

{% if success %}
<div class="alert alert-success">
    Patient details received successfully.
</div>
{% endif %}

<form method="POST" action="/add">

<div class="mb-3">

<label>Full Name</label>

<input type="text" name="fullname" class="form-control" maxlength="35" required>

</div>

<div class="mb-3">

<label>Date of Birth</label>

<input type="date" name="dob" class="form-control" required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email" name="email" class="form-control" required>

</div>

<div class="mb-3">

<label>Glucose</label>

<input type="number"

step="0.1" min="0" name="glucose" class="form-control" required>

</div>

<div class="mb-3">

<label>Haemoglobin</label>

<input type="number" step="0.1" min="0" name="haemoglobin" class="form-control" required>

</div>

<div class="mb-3">

<label>Cholesterol</label>

<input type="number" step="0.1" min="0" name="cholesterol" class="form-control" required>

</div>

<button class="btn btn-primary"> Save Patient </button>

<a href="/" class="btn btn-secondary"> Cancel </a>

</form>
</div>
</div>

{% endblock %}
